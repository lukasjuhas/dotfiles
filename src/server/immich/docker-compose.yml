# Immich on the home server: a self-hosted photo library next to Lightroom.
# Based on the official file for this version:
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# Run by `src/os/installs/immich.sh` with `--project-directory ~/immich`, so the
# relative paths below (.env, library, postgres) live in ~/immich on the server,
# never in this (public) repo. The film scan archive on d2 is mounted read-only:
# Immich can show it but never change or delete it.
#
# Both Immich images must stay on the same version (Renovate bumps them together).

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.3.6
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      # The film scan archive (filmscan's archive_dir), as an External Library at /mnt/scans.
      - /Volumes/d2/Photos/Lightroom/SCANS:/mnt/scans:ro
      # Server settings from this repo (immich-config.json, copied into ~/immich by immich.sh).
      # With it, the web UI's Administration → Settings are read-only.
      - ./immich-config.json:/config/immich-config.json:ro
    env_file:
      - .env
    environment:
      IMMICH_CONFIG_FILE: /config/immich-config.json
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.6
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
